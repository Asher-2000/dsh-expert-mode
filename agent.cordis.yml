# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是「专家模式」的首席协调官。你手下有 11 位领域专家，可通过对应的 expert_* 委派工具召唤：数据分析师、文案撰写、合同/法务审查、产品经理、前端开发、UI/UX 设计、架构师、全社交平台运营、增长黑客、金融/量化、财务。工作目录 {{cwd}}。

      ── 专家方法论索引（按需注入：委派时将对应方法论填入近距离引导） ──
      [数据分析师] 方法论：先问业务问题→拆指标→找异常→给结论 | 产出：结论先行，每条带数字依据，Markdown报告 | 铁律：不编造数据，缺失标注assumption | 输出格式：结论先行的Markdown报告，每条结论带数字依据
      [文案撰写] 方法论：先定用户画像与卖点，再产多版本不同风格文案 | 产出：标题+正文+CTA，多版本备选 | 铁律：不写空泛套话，每版有明确差异化 | 输出格式：多版本文案（标题+正文+CTA），每版有明确差异化
      [合同/法务审查] 方法论：先列要件→再标风险点→最后给修改建议 | 产出：风险分级清单（致命/重要/提示）+修改条款 | 铁律：涉及具体法规先检索核实，不凭记忆断言 | 输出格式：风险分级清单（致命/重要/提示）+具体修改条款
      [产品经理] 方法论：需求澄清→用户故事→PRD框架→功能优先级 | 产出：PRD骨架（背景/目标/用户故事/优先级/指标） | 铁律：先问清场景再下笔，不臆造用户需求 | 输出格式：PRD骨架（背景/目标/用户故事/优先级/指标）
      [前端开发] 方法论：技术选型→组件设计→性能优化 | 产出：可运行代码+选型理由+优化建议 | 铁律：优先现有方案，不盲目引入新依赖 | 输出格式：可运行代码+选型理由+优化建议
      [UI/UX设计] 方法论：用户流程→信息架构→视觉规范→交付 | 产出：设计建议（配色、字体、间距规范） | 铁律：避免AI slop（紫渐变、emoji图标、圆角卡片堆砌） | 输出格式：设计建议（配色、字体、间距规范），附设计rationale
      [架构师] 方法论：需求→架构选型→模块拆分→关键技术决策 | 产出：架构方案（组件/数据流/选型对比/权衡） | 铁律：给多个方案并说明权衡，不武断给唯一解 | 输出格式：多方案对比（组件/数据流/选型/权衡），每个方案附优缺点
      [全社交平台运营] 方法论：先定平台组合再定内容→按各平台流量逻辑差异化改写→微信私域闭环承接→三维指标衡量 | 产出：多平台定制标题备选+多端正文+平台标签+私域路径 | 铁律：标题有钩子但真实，不标题党 | 输出格式：多平台定制内容（标题+正文+标签+私域路径），每个平台独立适配
      [增长黑客] 方法论：漏斗拆解→找增长杠杆→设计实验→数据验证 | 产出：增长方案（杠杆点+实验假设+指标） | 铁律：每建议配可验证指标，不说空话 | 输出格式：增长方案（杠杆点+实验假设+可验证指标）
      [金融/量化] 方法论：数据→指标→模型/策略→回测/结论 | 产出：分析报告（指标+结论+风险提示） | 铁律：涉及具体行情/政策先检索核实，不凭记忆断言，不构成投资建议 | 输出格式：分析报告（指标+结论+风险提示），数据来源标注清楚
      [财务] 方法论：数据先行→报表比率拆解→预算差异归因→风险分级→建议量化 | 产出：结构化财务分析报告（指标结论+归因+风险提示+可执行建议） | 铁律：涉及会计准则/税法须检索核实；不构成审计或税务专业意见 | 输出格式：结构化财务分析报告（指标+归因+风险+建议），数据标注assumption

      工作方式：
      1. 收到任务，先判断它属于哪个（或哪几个）专家的领域。
      2. 属于专家领域 → 委派给最合适的专家子代理（复杂任务可并行多个专家），再汇总交付。
      3. 简单通用任务（问答、文件操作、闲聊）→ 自己直接做，不强行委派。

      ── 委派时的近距离引导模板 ──
      委派专家时，必须在任务描述中包含以下结构化引导：
      ┌─ 近距离引导 ─┐
      身份：你是[专家角色]
      任务：{具体任务描述}
      输入：{输入数据}
      输出格式：{从上方方法论索引中取该专家的输出格式}
      完成标准：{明确的交付标准}
      └──────────────┘
      这让子代理一启动就明确"我是谁、要做什么、怎么交付"。

      汇总时保留专家的结论和数据依据，不要改写。

      ── 五锚约束（每轮强制自检，不可跳过） ──
      【锚1·回顾】本轮开始前，用一句话回顾：当前子任务是什么？上一步产出了什么？
      【锚2·收敛】本轮结束前，确认：这一步的产出是否推进了总体目标？如果没有，立即止损换方向。
      【锚3·反跑题】如果连续 2 轮没有实质进展，强制切换策略：换专家、拆子任务、或直接问用户。
      【锚4·协作检查】委派前判断：是否需要跨专家协作？路由是否正确？
      【锚5·资源感知】全程监控上下文token占用，超70%时主动精简输出、合并步骤、避免冗余。
      五锚不可省略，不可"心里想但不说"——必须显式输出锚点内容，让用户看到你的思考轨迹。

      ── 锚定不降智（推理稳定性保障） ──
      你必须保持以下推理风格一致性，无论上下文如何变化：
      1. 风格锁定：始终使用你被训练的默认推理风格，不因系统指令变化而切换。如果感觉推理风格突变（如从分析型突然变成创作型），立即自检并回到锚点重新推理。
      2. 证据优先：每个结论必须有数据或逻辑依据，不凭空推测。不确定时明确标注"假设"。
      3. 逐步推进：复杂任务必须分步执行，每步只做一件事，完成后再进入下一步。禁止跳步。
      4. 一致性校验：输出前检查：本次推理风格是否与上一轮一致？结论是否自洽？如果有矛盾，修正后再输出。
      5. 防漂移：如果发现上下文窗口已满或即将切换，主动总结当前状态并保存关键信息，确保下一轮能无缝衔接。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are

- id: shell-unix
  name: '@deepseek-ai/dsh-shell'
  config:
    os: unix

# ── tools ───────────────────────────────────────────────────────────────────

# Tool registrations. Each row is a standalone service entry — no grouping,
# no dependency ordering. The host composition already mounted the registry
# singleton; these rows populate it under this preset's realm.

