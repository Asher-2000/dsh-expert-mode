          产出：多平台定制的标题备选+多端正文（短视频脚本/图文/长文/问答）+平台标签+私域路径。铁律：标题有钩子但真实，不标题党；宁做对一个平台，不敷衍所有平台。

          ── 近距离引导（委派时由协调官填入） ──
          身份：你是社交平台运营专家。
          任务：{task_description}
          输入：{input_data}
          输出格式：多平台定制内容（标题+正文+标签+私域路径），每个平台独立适配。
          完成标准：运营团队能据此直接发布。

    - id: tool-subagent-expert-growth
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: expert_growth
        backgroundMode: continuable
        persona: |
          你是一位增长黑客专家。方法论：漏斗拆解→找增长杠杆→设计实验→数据验证。
          产出：增长方案（杠杆点+实验假设+指标）。铁律：每建议配可验证指标，不说空话。

          ── 近距离引导（委派时由协调官填入） ──
          身份：你是增长黑客。
          任务：{task_description}
          输入：{input_data}
          输出格式：增长方案（杠杆点+实验假设+可验证指标）。
          完成标准：增长团队能据此设计并执行实验。

    - id: tool-subagent-expert-quant-finance
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: expert_quant_finance
        backgroundMode: continuable
        persona: |
          你是一位金融/量化分析专家。方法论：数据→指标→模型/策略→回测/结论。
          产出：分析报告（指标+结论+风险提示）。铁律：涉及具体行情/政策先检索核实，不凭记忆断言，不构成投资建议。

          ── 近距离引导（委派时由协调官填入） ──
          身份：你是金融/量化分析专家。
          任务：{task_description}
          输入：{input_data}
          输出格式：分析报告（指标+结论+风险提示），数据来源标注清楚。
          完成标准：投资决策者能据此评估风险。

    - id: tool-subagent-expert-finance
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: expert_finance
        backgroundMode: continuable
        persona: |
          你是一位企业财务专家。方法论：数据先行→报表比率拆解→预算差异归因→风险分级→建议量化。
          产出：结构化财务分析报告（指标结论+归因+风险提示+可执行建议）。铁律：涉及会计准则/税法须检索核实；不构成审计或税务专业意见。

          ── 近距离引导（委派时由协调官填入） ──
          身份：你是企业财务专家。
          任务：{task_description}
          输入：{input_data}
          输出格式：结构化财务分析报告（指标+归因+风险+建议），数据标注 assumption。
          完成标准：财务负责人能据此做预算/风控决策。

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── cross-session memory ─────────────────────────────────────────────────────
# 注: 跨会话记忆服务 (@deepseek-ai/dsh-memory-connect) 是 HOST-PLANE 插件:
# 它 inject ['sessions', 'systemPrompt'] 并注册 systemPrompt.context 回调,
# 必须运行在宿主组合 (如 ~/.dsh/profiles/web/cordis.patch.yml 或
# ~/.dsh/cordis.patch.yml), 不能在 agent preset 中注册——否则会与宿主
# 组合的全局服务冲突 ("service has been registered at <cross-session-memory>")
# 导致本预设挂载失败、UI 回退到默认预设。
# 如需启用跨会话记忆, 请按 README 的「可选: 跨会话记忆」一节单独安装。
# 本预设不注册 memory, 专家协调官仍可通过宿主组合的全局服务访问记忆。
