# DSH UI Plugin 集成配置
# Expert Mode Pro Web UI 管理面板

name: "@local/dsh-expert-mode-pro-ui"
version: "0.1.0"
description: "Expert Mode Pro Web UI管理面板 - 任务管理、专家监控、交叉评审可视化、经验沉淀查看"

# 客户端注入配置
client:
  inject:
    - type: js
      source: ./lib/client.js

# 组件元数据
metadata:
  author: "Expert Mode Team"
  license: "MIT"
  tags:
    - expert-mode
    - task-management
    - expert-monitor
    - review
    - experience
    - dashboard
  features:
    - "任务管理界面（创建/编辑/删除/依赖/分配）"
    - "专家状态监控（11位专家状态/任务/统计）"
    - "交叉评审可视化（评审任务/参与专家/意见对比）"
    - "经验沉淀查看（经验/搜索/分类/导出）"
    - "响应式设计，支持移动端"
    - "暗色模式支持"
    - "纯JavaScript实现，零依赖"
