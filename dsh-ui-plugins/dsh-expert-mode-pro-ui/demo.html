<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expert Mode Pro UI - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .demo-container {
      text-align: center;
      padding: 40px;
    }
    .demo-container h1 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .demo-container p {
      color: #64748b;
      margin-bottom: 24px;
    }
    .demo-hint {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .demo-hint .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .demo-hint h2 {
      font-size: 18px;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .demo-hint p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>🎯 Expert Mode Pro UI</h1>
    <p>DSH Expert Mode Pro Web UI 管理面板</p>
    <div class="demo-hint">
      <div class="icon">👉</div>
      <h2>点击右下角按钮打开面板</h2>
      <p>点击页面右下角的 🎯 浮动按钮，即可打开 Expert Mode Pro 管理面板。</p>
    </div>
  </div>

  <script type="module">
    import './lib/client.js';
  </script>
</body>
</html>
